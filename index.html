<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Couple Photobooth 💕</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
text-align:center;
padding:20px;

background:
linear-gradient(
135deg,
#ffd6e7,
#ffc2d9,
#ffb6d5
);

min-height:100vh;
}

h1{
font-family:'Pacifico',cursive;
color:white;
font-size:2rem;
margin-bottom:15px;
text-shadow:0 4px 10px rgba(0,0,0,.2);
}

.booth{

background:white;

width:95%;
max-width:420px;

margin:auto;

padding:18px;

border-radius:25px;

box-shadow:
0 15px 35px rgba(0,0,0,.18);

}

video{

width:100%;

aspect-ratio:3/4;

object-fit:cover;

border-radius:20px;

background:black;

}

input{

width:100%;

padding:12px;

margin-top:12px;

border-radius:20px;

border:1px solid #ddd;

text-align:center;

font-size:15px;

}

button{

width:100%;

padding:12px;

margin-top:10px;

border:none;

border-radius:20px;

cursor:pointer;

font-size:15px;

font-weight:bold;

color:white;

background:#ff5fa2;

transition:.3s;

}

button:hover{
transform:scale(1.03);
}

#download{
display:none;
background:#4CAF50;
}

#reset{
display:none;
background:#555;
}

#counter{

font-size:60px;

font-weight:bold;

color:white;

margin-top:15px;

height:70px;

}

canvas{
display:none;
}

.footer{
margin-top:15px;
color:white;
font-size:13px;
}

</style>
</head>

<body>

<h1>Couple Photobooth 💕</h1>

<div class="booth">

<video id="video" autoplay playsinline></video>

<div id="counter"></div>

<input
id="nameInput"
placeholder="Masukkan Nama Couple 💑">

<button id="switchCam">
🔄 Ganti Kamera
</button>

<button id="capture">
📸 Ambil Foto
</button>

<button id="download">
⬇️ Download Hasil
</button>

<button id="reset">
🔄 Ulangi
</button>

<canvas id="canvas"></canvas>

</div>

<div class="footer">
Made with ❤️ Photobooth Couple
</div>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const captureBtn=document.getElementById("capture");
const downloadBtn=document.getElementById("download");
const resetBtn=document.getElementById("reset");
const switchCamBtn=document.getElementById("switchCam");
const counter=document.getElementById("counter");
const nameInput=document.getElementById("nameInput");

let photos=[];
let stream=null;
let currentFacing="user";

async function startCamera(){

try{

if(stream){
stream.getTracks().forEach(t=>t.stop());
}

stream=await navigator.mediaDevices.getUserMedia({

video:{
facingMode:currentFacing
},
audio:false

});

video.srcObject=stream;

}catch(err){

alert(
"Kamera tidak dapat diakses.\n\nPastikan menggunakan HTTPS atau GitHub Pages."
);

console.error(err);

}

}

startCamera();

switchCamBtn.onclick=()=>{

currentFacing=
currentFacing==="user"
?
"environment"
:
"user";

startCamera();

};

async function countdown(){

for(let i=3;i>0;i--){

counter.innerHTML=i;

await new Promise(
r=>setTimeout(r,1000)
);

}

counter.innerHTML="📸";

await new Promise(
r=>setTimeout(r,500)
);

counter.innerHTML="";

}

captureBtn.onclick=async()=>{

if(photos.length>=3) return;

await countdown();

const temp=document.createElement("canvas");

temp.width=video.videoWidth;
temp.height=video.videoHeight;

temp
.getContext("2d")
.drawImage(
video,
0,
0
);

photos.push(temp);

if(photos.length===3){

await document.fonts.ready;

createStrip();

downloadBtn.style.display="block";
resetBtn.style.display="block";

captureBtn.disabled=true;

}

};

function drawHeart(x,y,size){

ctx.save();

ctx.translate(x,y);

ctx.beginPath();

ctx.moveTo(0,0);

ctx.bezierCurveTo(
0,-size,
-size,-size,
-size,0
);

ctx.bezierCurveTo(
-size,size,
0,size*1.5,
0,size*2
);

ctx.bezierCurveTo(
0,size*1.5,
size,size,
size,0
);

ctx.bezierCurveTo(
size,-size,
0,-size,
0,0
);

ctx.fillStyle="#ff4d88";

ctx.fill();

ctx.restore();

}

function createStrip(){

const stripW=700;
const photoW=420;
const photoH=560;
const gap=30;

canvas.width=stripW;

canvas.height=
140+
(photoH+gap)*3+
220;

const grad=
ctx.createLinearGradient(
0,
0,
0,
canvas.height
);

grad.addColorStop(0,"#ffe0ec");
grad.addColorStop(1,"#ffc4dc");

ctx.fillStyle=grad;
ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

ctx.textAlign="center";

ctx.font="50px Pacifico";
ctx.fillStyle="#ff4d88";

ctx.fillText(
"Couple Photobooth",
stripW/2,
80
);

let y=120;

photos.forEach(p=>{

const x=
(stripW-photoW)/2;

ctx.shadowColor=
"rgba(0,0,0,.2)";

ctx.shadowBlur=20;

ctx.shadowOffsetY=8;

ctx.fillStyle="white";

ctx.fillRect(
x-15,
y-15,
photoW+30,
photoH+30
);

ctx.shadowBlur=0;

ctx.drawImage(
p,
x,
y,
photoW,
photoH
);

drawHeart(
x-40,
y+100,
12
);

drawHeart(
x+photoW+40,
y+150,
12
);

y+=photoH+gap;

});

ctx.font="45px Pacifico";
ctx.fillStyle="#ff4d88";

ctx.fillText(
nameInput.value || "Couple 💑",
stripW/2,
canvas.height-110
);

ctx.font="25px Arial";

ctx.fillText(
new Date().toLocaleDateString("id-ID"),
stripW/2,
canvas.height-60
);

}

downloadBtn.onclick=()=>{

const a=
document.createElement("a");

a.download=
"couple-photobooth.png";

a.href=
canvas.toDataURL("image/png");

a.click();

};

resetBtn.onclick=()=>{

photos=[];

downloadBtn.style.display="none";
resetBtn.style.display="none";

captureBtn.disabled=false;

counter.innerHTML="";

};

</script>

</body>
</html>
